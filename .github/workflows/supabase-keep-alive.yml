name: Supabase keep-alive

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_ANON_KEY" ]]; then
            echo "::error::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY in the repository Actions secrets."
            exit 1
          fi

          curl \
            --fail \
            --silent \
            --show-error \
            --output /dev/null \
            --max-time 20 \
            --header "apikey: $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/"

          echo "Supabase REST API responded successfully."
